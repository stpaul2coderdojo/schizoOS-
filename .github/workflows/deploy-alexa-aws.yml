name: Deploy Alexa Skill & Lambda to AWS

on:
  push:
    branches:
      - main
    paths:
      - 'alexa/**'
      - 'src/**'
      - 'server.ts'
      - 'lambda.ts'
      - 'Dockerfile.lambda'
      - 'deploy/**'
      - '.github/workflows/deploy-alexa-aws.yml'
  workflow_dispatch:

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read

env:
  AWS_REGION: us-east-1
  FUNCTION_NAME: vayu-vaidya-wallmiki
  ECR_REPO_NAME: vayu-vaidya-wallmiki
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy-aws-lambda:
    name: Build & Deploy Containerized Lambda to AWS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Ensure ECR Repository Exists
        run: |
          aws ecr describe-repositories --repository-names "${{ env.ECR_REPO_NAME }}" --region "${{ env.AWS_REGION }}" >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name "${{ env.ECR_REPO_NAME }}" \
            --region "${{ env.AWS_REGION }}" \
            --image-scanning-configuration scanOnPush=true \
            --encryption-configuration encryptionType=AES256

      - name: Build and Push Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/${{ env.ECR_REPO_NAME }}:${{ env.IMAGE_TAG }}"
          LATEST_URI="$ECR_REGISTRY/${{ env.ECR_REPO_NAME }}:latest"
          
          echo "Building Docker image: $IMAGE_URI"
          docker build \
            -f Dockerfile.lambda \
            -t "$IMAGE_URI" \
            -t "$LATEST_URI" .
          
          echo "Pushing Docker image to ECR..."
          docker push "$IMAGE_URI"
          docker push "$LATEST_URI"

      - name: Deploy or Update AWS Lambda Function
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/${{ env.ECR_REPO_NAME }}:${{ env.IMAGE_TAG }}"
          
          # Check if Lambda exists
          if aws lambda get-function --function-name "${{ env.FUNCTION_NAME }}" --region "${{ env.AWS_REGION }}" >/dev/null 2>&1; then
            echo "Updating existing Lambda function code..."
            aws lambda update-function-code \
              --function-name "${{ env.FUNCTION_NAME }}" \
              --image-uri "$IMAGE_URI" \
              --region "${{ env.AWS_REGION }}"
            
            echo "Waiting for Lambda code update to complete..."
            aws lambda wait function-updated --function-name "${{ env.FUNCTION_NAME }}" --region "${{ env.AWS_REGION }}"
            
            echo "Updating function configuration..."
            aws lambda update-function-configuration \
              --function-name "${{ env.FUNCTION_NAME }}" \
              --timeout 30 \
              --memory-size 1024 \
              --region "${{ env.AWS_REGION }}"
          else
            echo "Lambda function '${{ env.FUNCTION_NAME }}' does not exist yet."
            echo "Creating Lambda execution role if needed..."
            LAMBDA_ROLE_NAME="${{ env.FUNCTION_NAME }}-lambda-role"
            
            LAMBDA_ROLE_ARN=$(aws iam get-role --role-name "$LAMBDA_ROLE_NAME" --query 'Role.Arn' --output text 2>/dev/null || true)
            if [ -z "$LAMBDA_ROLE_ARN" ]; then
              LAMBDA_ROLE_ARN=$(aws iam create-role \
                --role-name "$LAMBDA_ROLE_NAME" \
                --assume-role-policy-document '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"lambda.amazonaws.com"},"Action":"sts:AssumeRole"}]}' \
                --query 'Role.Arn' --output text)
              aws iam attach-role-policy \
                --role-name "$LAMBDA_ROLE_NAME" \
                --policy-arn "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
              sleep 10
            fi

            echo "Creating new Lambda function with container image..."
            aws lambda create-function \
              --function-name "${{ env.FUNCTION_NAME }}" \
              --package-type Image \
              --code ImageUri="$IMAGE_URI" \
              --role "$LAMBDA_ROLE_ARN" \
              --timeout 30 \
              --memory-size 1024 \
              --region "${{ env.AWS_REGION }}"
            
            aws lambda wait function-active --function-name "${{ env.FUNCTION_NAME }}" --region "${{ env.AWS_REGION }}"
          fi

      - name: Authorize Alexa Skills Kit Trigger
        run: |
          echo "Ensuring Alexa Skills Kit has invoke permissions on Lambda..."
          aws lambda add-permission \
            --function-name "${{ env.FUNCTION_NAME }}" \
            --statement-id "AlexaSkillsKitInvokePermission" \
            --action "lambda:InvokeFunction" \
            --principal "alexa-appkit.amazon.com" \
            --region "${{ env.AWS_REGION }}" 2>/dev/null || echo "Permission statement already exists."

      - name: Configure Public Function URL (Optional Web/HTTPS Hook)
        run: |
          aws lambda create-function-url-config \
            --function-name "${{ env.FUNCTION_NAME }}" \
            --auth-type NONE \
            --region "${{ env.AWS_REGION }}" 2>/dev/null || true

          aws lambda add-permission \
            --function-name "${{ env.FUNCTION_NAME }}" \
            --statement-id "FunctionURLAllowPublicAccess" \
            --action "lambda:InvokeFunctionUrl" \
            --principal "*" \
            --function-url-auth-type NONE \
            --region "${{ env.AWS_REGION }}" 2>/dev/null || true

          FUNCTION_URL=$(aws lambda get-function-url-config --function-name "${{ env.FUNCTION_NAME }}" --region "${{ env.AWS_REGION }}" --query 'FunctionUrl' --output text 2>/dev/null || true)
          echo "Lambda Function URL: $FUNCTION_URL"

  deploy-alexa-model:
    name: Sync Alexa Skill Interaction Model & Manifest
    needs: deploy-aws-lambda
    runs-on: ubuntu-latest
    if: "${{ secrets.ASK_ACCESS_TOKEN != '' && secrets.ALEXA_SKILL_ID != '' }}"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ASK CLI
        run: npm install -g ask-cli

      - name: Deploy Alexa Skill Manifest & Interaction Model via SMAPI
        env:
          ASK_ACCESS_TOKEN: ${{ secrets.ASK_ACCESS_TOKEN }}
          ASK_REFRESH_TOKEN: ${{ secrets.ASK_REFRESH_TOKEN }}
          ALEXA_SKILL_ID: ${{ secrets.ALEXA_SKILL_ID }}
        run: |
          echo "Deploying Alexa interaction model and manifest for skill: $ALEXA_SKILL_ID"
          ask smapi set-interaction-model \
            --skill-id "$ALEXA_SKILL_ID" \
            --locale en-US \
            --stage development \
            --interaction-model "file:alexa/interactionModels/custom/en-US.json"
          
          ask smapi update-skill-manifest \
            --skill-id "$ALEXA_SKILL_ID" \
            --stage development \
            --manifest "file:alexa/skill.json"
          
          echo "Alexa skill interaction model and manifest updated successfully!"
