# ==============================================================================
# Render.com Blueprint Specification for Vayu Vaidya • Wallmiki
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # Primary Web Service (Docker Container)
  - type: web
    name: vayu-vaidya-wallmiki
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free # Change to 'starter' or 'standard' for production SLAs
    region: oregon # Options: oregon, ohio, frankfurt, singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: GEMINI_API_KEY
        sync: false # Set via Render Dashboard or during Blueprint setup
